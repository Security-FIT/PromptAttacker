# @file configSequential.yaml
# @brief Configuration file for Sequential attack parameters
#
# @author Bc. Petr Kaška
# @date 30.1.2026
#

Sequential:
  # @brief Sampling temperature for the victim LLM
  # @details
  #  - Higher values increase randomness in intermediate steps
  temperature: 0.8

  # @brief Maximum number of tokens generated per step
  max_tokens: 512

  # @brief Number of sequential transformation steps
  # @details
  #  Each step builds on the output of the previous one.
  #  Higher values increase attack depth but also runtime.
  steps: 3

  # @brief Index of the first dataset sample to process
  begin: 0

  # @brief Index of the last dataset sample to process (exclusive)
  end: 13282