## @file configArt.yaml
#  @brief Configuration file for the ArtPrompt (ASCII-art–based) jailbreak attack
#
#  @author Bc. Petr Kaška
#  @date 1.2.2026
#

ArtPrompt:
  # @brief Maximum number of tokens generated by the victim model.
  max_token: 512

  # @brief Sampling temperature for the masking LLM.
  # @details Controls variability when selecting the token to be masked.
  mask_temperature: 0.7

  # @brief Maximum number of tokens generated by the masking LLM.
  # @details Limits the length of the masking response (two-line output).
  mask_max_token: 256

  # @brief Path to the ASCII font definition file.
  # @details JSON file containing glyph definitions used to render masked tokens
  #          into ASCII art.
  ascii_font_file: "/storage/brno2/home/xkaska01/master/my_implementation/attacks/_21_Art_Prompt/art.json"

  # @brief Enables or disables chain-of-thought prompting.
  cot: false
