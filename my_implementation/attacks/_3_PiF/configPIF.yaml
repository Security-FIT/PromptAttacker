# @file configPif.yaml
# @brief Configuration file for Pif attack parameters
#
# @author Bc. Petr Kaška
# @date 30.1.2026
#

PIF:
  # @brief Path to the generation model
  gen_model_path: "/storage/brno2/home/xkaska01/master/my_implementation/models/Llama-2-13b-chat"

  # @brief Path to the target (victim) model
  tgt_model_path: "/storage/brno2/home/xkaska01/master/my_implementation/models/Llama-2-7b-hf/"

  # @brief Prompt template used for querying the target model
  # @details The placeholder {} is replaced by the generated adversarial prompt.
  prompt_template: "Human: {}. Assistant: "

  # @brief Evaluation template for token-importance estimation
  # @details The [MASK] token is used by masked language models to estimate semantic changes during token replacement.
  evaluation_template: "this intent is [MASK]"

  # @brief Optimization objective
  # @details
  #  - ASR: Attack Success Rate (based on refusal-prefix heuristics)
  #  - ASR+Filter: Success judged by a safety filter model
  opt_objective: "ASR"

  # @brief Number of prompts processed in parallel
  batch_size: 1

  # @brief Number of attack iterations per prompt
  # @details Higher values increase attack strength at the cost of runtime.
  iterations: 20

  # @brief Number of least-important tokens considered for replacement
  top_n: 5

  # @brief Number of replacement candidates sampled per token
  top_m: 5

  # @brief Top-k vocabulary size used during token confidence evaluation
  top_k: 10

  # @brief Warm-up iterations before querying the target model
  # @details Allows the attack to refine prompts before counting queries.
  warm_up: 0

  # @brief Sampling temperature for token replacement
  # @details Lower values make replacement more deterministic.
  temperature: 0.1

  # @brief Semantic similarity threshold
  # @details Controls how much the adversarial prompt is allowed to deviate
  #          from the original prompt. Higher values enforce stronger similarity.
  threshold: 0.9