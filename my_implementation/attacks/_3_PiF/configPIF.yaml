PIF:
  # === modely ===
  gen_model_path: "models/Llama-2-7b-hf"
  tgt_model_path: "models/Llama-2-13b-chat"

  # === dataset + výstup ===
  att_file: "/storage/brno2/home/xkaska01/master/my_implementation/dataset/pif.txt"
  output_dir: "./results"
  output_file: "_3_PIF.json"

  # === šablony a objektiv ===
  prompt_template: "Human: {}. Assistant: "
  evaluation_template: "this intent is [MASK]"
