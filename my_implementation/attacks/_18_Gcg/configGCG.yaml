## @file configGCG.yaml
#  @brief Configuration file for the GCG (Greedy Coordinate Gradient) attack
#
#  @author Bc. Petr Kaška
#  @date 1.2.2026

GCG:
  # @brief Number of top candidate tokens considered per control position.
  topk: 256

  # @brief Initial control string (adversarial suffix).
  control_init: "! ! ! ! ! ! ! ! ! ! !"

  # @brief Sampling temperature during suffix optimization.
  temperature: 0.8

  # @brief Maximum number of tokens generated by the victim model.
  max_tokens: 4096

  # @brief End index of the processed evaluation dataset.
  end: 1119

  # @brief Path to the victim language model.
  victim_llm: "/storage/brno2/home/xkaska01/master/my_implementation/models/Llama-2-7b-hf/"

  # @brief Path to the evaluation dataset.
  dataset_path: "/storage/brno2/home/xkaska01/master/my_implementation/dataset/dataset_40_ZH.csv"

  # @brief Number of optimization steps for suffix training.
  train_steps: 100

  # @brief Batch size used during suffix optimization.
  train_batch_size: 500

  # @brief Enables or disables suffix optimization.
  # @details
  #   - true  → run GCG optimization to learn a new adversarial suffix
  #   - false → skip optimization and directly evaluate `control_init`
  optimize_suffix: false