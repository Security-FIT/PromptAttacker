## @file configRenellm.yaml
#  @brief Configuration file for the ReNeLLM jailbreak attack
#
#  @author Bc. Petr Kaška
#  @date 1.2.2026
#

ReNeLLM:
  # @brief Sampling temperature for the masking LLM.
  # @details Controls variability when selecting the token to be masked.
  temperature: 0.8

  # @brief Maximum number of tokens generated by the victim model.
  max_token: 512

  # @brief Maximum number of ReNeLLM attack iterations.
  # @details Specifies the maximum number of rewriting operations
  iter_max: 10

  # @brief Enables or disables chain-of-thought prompting.
  cot: false
