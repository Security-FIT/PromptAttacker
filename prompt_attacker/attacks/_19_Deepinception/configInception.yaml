## @file configInception.yaml
#  @brief Configuration file for the DeepInception narrative-based jailbreak attack
#
#  @author Bc. Petr Kaška
#  @date 1.2.2026
#

DeepInception:
  # @brief Controls the randomness of the generated responses.
  temperature: 0.8

  # @brief Maximum number of tokens generated by the victim model.
  max_token: 512

  # @brief Narrative genre used in the DeepInception prompt.
  scene: "science fiction"

  # @brief Number of characters introduced at each narrative layer.
  character_number: 5

  # @brief Depth of narrative recursion (number of layers).
  layer_number: 5

  # @brief Start index of the processed dataset.
  begin: 0

  # @brief End index of the processed dataset.
  end: 13282
