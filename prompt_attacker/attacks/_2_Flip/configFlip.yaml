# @file configFlip.yaml
# @brief Configuration file for Flip attack parameters
#
# @author Bc. Petr Kaška
# @date 30.1.2026
#

Flip:
  # @brief Controls randomness of the LLM output
  # @details Higher values increase diversity and creativity of generated responses.
  # @range 0.0 – 1.0
  temperature: 0.8

  # @brief Maximum number of tokens generated by the LLM
  # @details Limits the length of the model response to prevent excessively long outputs.
  max_token: 512

  # @brief Flip attack mode
  # @details Defines the specific FlipAttack strategy to be applied.
  flip_mode: "FWO"

  # @brief Enables chain-of-thought prompting
  cot: false

  # @brief Enables language-specific GPT prompting
  lang_gpt: false

  # @brief Enables few-shot examples
  few_shot: false

  # @brief Start index of the processed dataset
  # @details Defines the index from which dataset processing begins.
  begin: 0

  # @brief End index of the processed dataset
  # @details Defines the index at which dataset processing ends.
  end: 13282