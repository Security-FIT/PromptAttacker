# @file configStruct.yaml
# @brief Configuration file for Struct attack parameters
#
# @author Bc. Petr Kaška
# @date 30.1.2026
#
SQL:
  # @brief Path to the attacker LLM
  # @details This model is used to generate SQL queries from natural-language goals.
  attacker_llm: "/storage/brno2/home/xkaska01/master/prompt_attacker/models/Llama-2-13b-chat"

  # @brief Path to the target (victim) LLM
  # @details The target model is evaluated under the SQL-based attack.
  target_llm: "/storage/brno2/home/xkaska01/master/prompt_attacker/models/Llama-2-7b-hf/"

  # @brief Sampling temperature for the attacker LLM
  # @details Controls diversity of generated SQL queries.
  temperature_attack: 0.7

  # @brief Sampling temperature for the target LLM
  # @details Controls diversity of the target model responses.
  temperature_target: 0.8

  # @brief Maximum number of tokens generated by both attacker and target models
  max_tokens: 512

  # @brief Enable few-shot SQL examples in the attacker prompt
  # @details When enabled, predefined (goal, SQL) examples are included
  #          to stabilize formatting and structure of generated queries.
  few_shot: true

  # @brief Number of attempts to generate a valid SQL code block
  # @details The attacker LLM is queried repeatedly until a ```sql block
  #          is produced or the maximum number of attempts is reached.
  num_attempts: 5

  # @brief Index of the first dataset sample to process
  begin: 0

  # @brief Index of the last dataset sample to process (exclusive)
  end: 13282