## @file configPast.yaml
#  @brief Configuration file for the Past jailbreak attack
#
#  @author Bc. Petr Kaška
#  @date 1.2.2026
#
PastTense:
  # @param reformulator_llm
  # Path or identifier of the reformulator language model.
  reformulator_llm: "/storage/brno2/home/xkaska01/master/prompt_attacker/models/Llama-2-7b-hf/" 

  # @param reformulator_temperature
  reformulator_temperature: 0.8

  # @param reformulator_max_tokens
  reformulator_max_tokens: 300


  ## @param target_temperature
  target_temperature: 0.8

  # @param target_max_tokens
  target_max_tokens: 300


  # @param attack_type
  # Allowed values:
  #   - "past"    : rewrite prompt as a question about the past
  #   - "future"  : rewrite prompt as a question about the future
  #   - "present" : rewrite prompt as a present-tense question
  attack_type: "past"

  # @param begin
  # Index of the first dataset example to attack.
  begin: 0

  # @param end
  # Index of the last dataset example (exclusive).
  end: 13282

  # @param n_restarts
  # Number of independent reformulation attempts per prompt.
  # Each restart samples a new reformulated prompt from the reformulator LLM.
  # The final result is taken from the last successful restart.
  n_restarts: 15
