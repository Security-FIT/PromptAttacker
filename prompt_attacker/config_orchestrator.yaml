# Main configuration for run_orchestrator.py.
#
# Most workflows only need changing:
#   - target_model / single_attack
#   - dataset_to_attack_path / results_dir
#   - dry_run
#   - eval_* paths when evaluating another result directory

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------

# If true, attacks use Ollama. If false, attacks use local vLLM/HF model folders.
use_ollama: false

# If true, PBS scripts are only created and not submitted.
dry_run: true

# Local cluster paths. Adjust these when moving the project to another account.
ollama_bin: "/storage/brno2/home/xkaska01/test/bin/ollama"
conda_env: "/storage/brno2/home/xkaska01/.conda/envs/diplomka"

# Runtime niceties.
interactive_heartbeat_seconds: 30
vllm_use_v1: false
normalize_cuda_visible_devices: true


# ---------------------------------------------------------------------------
# Model and dataset paths
# ---------------------------------------------------------------------------

# Local model directories for vLLM mode.
models_dir: "models"
local_model_path: "models"

# Main input/output locations.
dataset_to_attack_path: "dataset/oponent_show"
results_dir: "results/oponent_show"

# Single attack settings.
target_model: "falcon3:3b"
single_attack: "_1_cypher"


# ---------------------------------------------------------------------------
# Rule-tree defense training
# ---------------------------------------------------------------------------

defense_train_script: "defense/def.py"
defense_train_dataset: "evaluate/selected_examples.json"
defense_train_output_rule: "defense/defense_rule_orchestrator.json"
defense_train_log_dir: "defense/gp_logs"

# Current setup: generation and judge are both called through Ollama.
# Keep both models installed in Ollama if you want to run --defense-train.
defense_train_use_vllm: false
defense_train_gen_model: "llama2:7b"
defense_train_judge_model: "gemma3:12b"

# Ollama request limits. First call can include model loading, so do not use 10s.
defense_train_ollama_timeout: 180
defense_train_ollama_max_retries: 2
defense_train_ollama_keep_alive: "30m"
defense_train_gen_max_tokens: 64
defense_train_judge_max_tokens: 4

# Small demo training run. Increase for a real experiment.
defense_train_pop_size: 2
defense_train_n_gen: 1
defense_train_n_tries: 1
defense_train_max_examples: 2


# ---------------------------------------------------------------------------
# Apply trained rule-tree defense to a dataset
# ---------------------------------------------------------------------------

defense_apply_script: "defense/apply_rules.py"
defense_apply_input_dir: "dataset/oponent_show"
defense_apply_output_dir: "dataset/oponent_show_with_defense_orchestrator"
defense_apply_rule_path: "defense/defense_rule_orchestrator.json"
defense_apply_seed: 42


# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------

eval_script: "evaluate/evaluate_full_results_datasets.py"
eval_input_dir: "results/oponent_show"
eval_output_dir: "results/oponent_show/eval"

# For a single-model evaluation, keep eval_models set.
# For full-batch evaluation of all model folders, set:
#   eval_models: []
#   eval_all_models: true
eval_models:
  - "falcon3:3b"
eval_all_models: false

eval_defense_name: "NO_DEFENSE"
eval_judge_model: "gemma3:12b"
eval_ollama_host: "http://localhost:11434"
eval_ollama_timeout: 180
eval_ollama_max_retries: 2
eval_ollama_keep_alive: "30m"
eval_judge_max_tokens: 4
eval_mode: "safety"
eval_success_threshold: 6
